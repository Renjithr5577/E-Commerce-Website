<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1400" height="860" fill="#f7f2e8"/>
  <text x="700" y="64" text-anchor="middle" class="label" style="font-size:32px;">LuxeCart Web Application Architecture</text>
  <rect x="70" y="300" rx="22" ry="22" width="240" height="130" fill="#243447"/>
  <text x="190" y="360" text-anchor="middle" class="title">Customer Users</text>
  <text x="190" y="392" text-anchor="middle" class="small" fill="#ffffff">Browse, cart, orders, support</text>
  <rect x="70" y="500" rx="22" ry="22" width="240" height="130" fill="#243447"/>
  <text x="190" y="560" text-anchor="middle" class="title">Admin Users</text>
  <text x="190" y="592" text-anchor="middle" class="small" fill="#ffffff">Products, orders, users, stock</text>
  <rect x="430" y="220" rx="22" ry="22" width="280" height="170" fill="#ff9f1c"/>
  <text x="570" y="285" text-anchor="middle" class="title">Angular Frontend</text>
  <text x="570" y="322" text-anchor="middle" class="small" fill="#ffffff">Home, checkout, account, support</text>
  <text x="570" y="350" text-anchor="middle" class="small" fill="#ffffff">Admin dashboard and admin pages</text>
  <rect x="430" y="470" rx="22" ry="22" width="280" height="170" fill="#457b9d"/>
  <text x="570" y="535" text-anchor="middle" class="title">Express API</text>
  <text x="570" y="572" text-anchor="middle" class="small" fill="#ffffff">Validation, auth, order logic</text>
  <text x="570" y="600" text-anchor="middle" class="small" fill="#ffffff">Support, admin, seed migrations</text>
  <rect x="860" y="300" rx="22" ry="22" width="290" height="170" fill="#2a9d8f"/>
  <text x="1005" y="365" text-anchor="middle" class="title">MySQL Database</text>
  <text x="1005" y="402" text-anchor="middle" class="small" fill="#ffffff">store_sections, products, orders</text>
  <text x="1005" y="430" text-anchor="middle" class="small" fill="#ffffff">users, support_tickets, card_details</text>
  <rect x="1210" y="360" rx="22" ry="22" width="140" height="110" fill="#e76f51"/>
  <text x="1280" y="415" text-anchor="middle" class="title" style="font-size:22px;">GitHub</text>
  <line x1="310" y1="345" x2="430" y2="290" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="310" y1="560" x2="430" y2="555" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="570" y1="390" x2="570" y2="470" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="710" y1="555" x2="860" y2="385" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1150" y1="385" x2="1210" y2="415" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="328" y="260" class="small">HTTP requests / responses</text>
  <text x="590" y="440" class="small">REST API calls</text>
  <text x="740" y="610" class="small">SQL read / write</text>
</svg>
