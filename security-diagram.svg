<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1400" height="860" fill="#f7f2e8"/>
  <text x="700" y="64" text-anchor="middle" class="label" style="font-size:32px;">Authentication and Data Protection Flow</text>
  <rect x="80" y="360" rx="20" ry="20" width="220" height="120" fill="#243447"/>
  <text x="190" y="417" text-anchor="middle" class="title">Login / Checkout</text>
  <rect x="380" y="360" rx="20" ry="20" width="220" height="120" fill="#ff9f1c"/>
  <text x="490" y="417" text-anchor="middle" class="title">Input Validation</text>
  <rect x="680" y="360" rx="20" ry="20" width="240" height="120" fill="#457b9d"/>
  <text x="800" y="405" text-anchor="middle" class="title">Hash + Salt</text>
  <text x="800" y="435" text-anchor="middle" class="small" fill="#ffffff">for customer/admin passwords</text>
  <rect x="1010" y="220" rx="20" ry="20" width="270" height="120" fill="#2a9d8f"/>
  <text x="1145" y="275" text-anchor="middle" class="title">Account Tables</text>
  <text x="1145" y="305" text-anchor="middle" class="small" fill="#ffffff">customer_accounts / admin_accounts</text>
  <rect x="1010" y="500" rx="20" ry="20" width="270" height="120" fill="#e76f51"/>
  <text x="1145" y="555" text-anchor="middle" class="title">Card Summary Table</text>
  <text x="1145" y="585" text-anchor="middle" class="small" fill="#ffffff">masked last4, expiry, brand only</text>
  <line x1="300" y1="420" x2="380" y2="420" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="600" y1="420" x2="680" y2="420" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="920" y1="400" x2="1010" y2="280" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="920" y1="440" x2="1010" y2="560" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="404" y="520" class="small">invalid input =&gt; toast failure message</text>
  <text x="705" y="660" class="small">valid input =&gt; safe storage and order success flow</text>
</svg>
