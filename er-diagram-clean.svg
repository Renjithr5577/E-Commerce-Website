<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#f7f2e8"/>
  <text x="800" y="58" text-anchor="middle" class="label" style="font-size:32px;">ER Diagram - LuxeCart Database</text>
  <rect x="60" y="120" rx="18" ry="18" width="240" height="120" fill="#243447"/>
  <text x="180" y="168" text-anchor="middle" class="title">store_sections</text>
  <text x="180" y="200" text-anchor="middle" class="small" fill="#ffffff">id, name, sort_order</text>
  <rect x="360" y="120" rx="18" ry="18" width="240" height="120" fill="#243447"/>
  <text x="480" y="168" text-anchor="middle" class="title">products</text>
  <text x="480" y="200" text-anchor="middle" class="small" fill="#ffffff">id, category, price, stock</text>
  <rect x="660" y="120" rx="18" ry="18" width="240" height="120" fill="#243447"/>
  <text x="780" y="168" text-anchor="middle" class="title">customer_accounts</text>
  <text x="780" y="200" text-anchor="middle" class="small" fill="#ffffff">id, name, email, phone</text>
  <rect x="960" y="120" rx="18" ry="18" width="240" height="120" fill="#243447"/>
  <text x="1080" y="168" text-anchor="middle" class="title">admin_accounts</text>
  <text x="1080" y="200" text-anchor="middle" class="small" fill="#ffffff">id, name, email, role</text>
  <rect x="1260" y="120" rx="18" ry="18" width="240" height="120" fill="#243447"/>
  <text x="1380" y="168" text-anchor="middle" class="title">support_tickets</text>
  <text x="1380" y="200" text-anchor="middle" class="small" fill="#ffffff">id, subject, status</text>
  <rect x="520" y="460" rx="18" ry="18" width="240" height="120" fill="#ff9f1c"/>
  <text x="640" y="508" text-anchor="middle" class="title">orders</text>
  <text x="640" y="540" text-anchor="middle" class="small" fill="#ffffff">id, order_reference, total_amount</text>
  <rect x="840" y="460" rx="18" ry="18" width="240" height="120" fill="#ff9f1c"/>
  <text x="960" y="508" text-anchor="middle" class="title">order_items</text>
  <text x="960" y="540" text-anchor="middle" class="small" fill="#ffffff">id, order_id, product_id, quantity</text>
  <rect x="1160" y="460" rx="18" ry="18" width="240" height="120" fill="#ff9f1c"/>
  <text x="1280" y="508" text-anchor="middle" class="title">card_details</text>
  <text x="1280" y="540" text-anchor="middle" class="small" fill="#ffffff">id, account_email, last4, brand</text>
  <line x1="300" y1="180" x2="360" y2="180" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="780" y1="240" x2="640" y2="460" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="600" y1="520" x2="840" y2="520" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="760" y1="520" x2="1160" y2="520" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1200" y1="220" x2="1260" y2="180" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="314" y="154" class="small">one section - many products</text>
  <text x="672" y="348" class="small">customer places order</text>
  <text x="814" y="492" class="small">order has items</text>
  <text x="975" y="605" class="small">card summary stored for card payments</text>
</svg>
