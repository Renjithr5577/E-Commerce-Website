<div class="store-shell">
  <div
    *ngIf="toastMessage()"
    class="app-toast"
    [class.app-toast-error]="toastTone() === 'error'"
    role="status"
    aria-live="polite"
  >
    <div class="app-toast-copy">
      <i [class]="toastTone() === 'success' ? 'bi bi-check-circle-fill' : 'bi bi-exclamation-circle-fill'"></i>
      <span>{{ toastMessage() }}</span>
    </div>
    <button type="button" class="app-toast-close" (click)="dismissToast()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <app-store-header
    *ngIf="currentView !== 'signin' && currentView !== 'signup' && currentView !== 'admin'"
    [navLinks]="navLinks"
    [currentView]="currentView"
    [searchTerm]="searchTerm"
    [selectedCategory]="selectedCategory"
    [isCatalogNavigationActive]="isCatalogNavigationActive"
    [cartCount]="cartCount"
    [cartSubtotal]="cartSubtotal"
    [selectedLanguage]="currentLanguage"
    [wishlistCount]="wishlist().length"
    [categories]="categories"
    [accountName]="accountName()"
    (homeRequest)="goHomeLanding()"
    (homeTabRequest)="goHomeTab()"
    (viewChange)="setView($event)"
    (searchTermChange)="setSearchTerm($event)"
    (searchCategoryChange)="setSearchCategory($event)"
    (searchRequest)="performSearch()"
    (catalogRequest)="showCatalog($event)"
    (checkoutRequest)="showCart()"
    (cartRequest)="showCart()"
    (wishlistRequest)="showWishlist()"
    (signInRequest)="openSignIn()"
    (signUpRequest)="openSignUp()"
    (signOutRequest)="confirmSignOut()"
    (languageChange)="setLanguage($event)"
  ></app-store-header>

  <main
    class="main-stage"
    [class.auth-stage]="currentView === 'signin' || currentView === 'signup' || currentView === 'admin'"
    [class.admin-stage]="currentView === 'admin'"
  >
    <app-home-page
      *ngIf="currentView === 'home'"
      [activeHero]="activeHero"
      [heroSlides]="heroSlides"
      [activeHeroIndex]="activeHeroIndex"
      [highlights]="highlights"
      [promoBoards]="promoBoards"
      [categories]="categories"
      [selectedCategory]="selectedCategory"
      [searchTerm]="searchTerm"
      [loading]="loading()"
      [error]="error()"
      [allProducts]="promoBoardProducts"
      [showWishlistSection]="isWishlistSectionVisible()"
      [wishlistProducts]="wishlist()"
      [showcaseProducts]="homeShowcaseProducts"
      [hasMoreCatalogProducts]="hasMoreCatalogProducts"
      [canShowLessCatalogProducts]="canShowLessCatalogProducts"
      [bestSellerProducts]="bestSellerProducts"
      [hasMoreBestSellerProducts]="hasMoreBestSellerProducts"
      [canShowLessBestSellerProducts]="canShowLessBestSellerProducts"
      (heroAction)="runHeroAction($event)"
      (previousHero)="prevHero()"
      (nextHero)="nextHero()"
      (heroSelect)="setHero($event)"
      (shopCategory)="showCatalog($event)"
      (refreshProducts)="refreshProductDisplay()"
      (categorySelect)="selectCategory($event)"
      (productOpen)="openProduct($event)"
      (productAdd)="addToCart($event)"
      (productBuy)="buyNow($event)"
      (showMoreCatalog)="showMoreCatalogProducts()"
      (showLessCatalog)="showLessCatalogProducts()"
      (showMoreBestSeller)="showMoreBestSellerProducts()"
      (showLessBestSeller)="showLessBestSellerProducts()"
      (wishlistToggle)="toggleWishlist($event)"
      (supportRequest)="setView('support')"
    ></app-home-page>

    <app-collections-page
      *ngIf="currentView === 'discover'"
      [collectionCards]="collectionCards"
      [dealProducts]="dealProducts"
      [featuredCount]="featuredProducts.length"
      [bestSellerCount]="bestSellerProducts.length"
      [categoryCount]="categories.length - 1"
      (showCatalog)="showCatalog($event)"
      (openProduct)="openProduct($event)"
      (addToCart)="addToCart($event)"
    ></app-collections-page>

    <app-support-page
      *ngIf="currentView === 'support'"
      [supportCards]="supportCards"
      [faqs]="faqs"
      [supportForm]="supportForm"
      [issueOptions]="supportIssueOptions"
      [customerTickets]="customerSupportTickets()"
      [ticketsLoading]="customerSupportLoading()"
      [ticketsError]="supportHistoryError"
      [accountName]="accountName()"
      [errorMessage]="supportError"
      [successMessage]="supportSuccess"
      [submitting]="supportSubmitting()"
      (backHome)="goHomeLanding()"
      (continueBuilding)="showCatalog()"
      (submitForm)="submitSupport()"
      (requestSignIn)="openSupportSignIn()"
    ></app-support-page>

    <app-account-page
      *ngIf="currentView === 'account'"
      [accountName]="accountName()"
      [profileForm]="accountProfileForm"
      [passwordForm]="accountPasswordForm"
      [passwordHintMode]="accountPasswordHintMode"
      [showPasswordHintMismatchNotice]="accountPasswordHintMismatch"
      [profileErrorMessage]="accountProfileError"
      [passwordErrorMessage]="accountPasswordError"
      [successMessage]="accountSuccess"
      (backHome)="goHomeLanding()"
      (continueShopping)="showCatalog()"
  (requestSignIn)="openAccountSignIn()"
  (saveProfile)="saveAccountProfile()"
  (updatePassword)="updateAccountPassword()"
  (openPasswordHintReset)="openAccountPasswordHintReset()"
  (resetPasswordWithHint)="resetAccountPasswordWithHint()"
  (cancelPasswordHintReset)="cancelAccountPasswordHintReset()"
></app-account-page>

    <app-orders-page
      *ngIf="currentView === 'orders'"
      [accountName]="accountName()"
      [orders]="customerOrders()"
      [ordersLoading]="customerOrdersLoading()"
      [ordersError]="customerOrdersError"
      [selectedOrder]="customerLatestOrder()"
      [selectedOrderLoading]="customerLatestOrderLoading()"
      [selectedOrderError]="customerLatestOrderError"
      [activeOrderId]="customerSelectedOrderId()"
      (backHome)="goHomeLanding()"
      (continueShopping)="showCatalog()"
      (requestSignIn)="openOrdersSignIn()"
      (showOrderDetail)="openCustomerOrderDetail($event)"
      (closeOrderDetail)="closeCustomerOrderDetail()"
    ></app-orders-page>

    <app-product-detail-page
      *ngIf="currentView === 'product'"
      [product]="selectedProduct()"
      [relatedProducts]="relatedProducts"
      (showCatalog)="showCatalog($event)"
      (addToCart)="addToCart($event)"
      (buyNow)="buyNow($event)"
      (openProduct)="openProduct($event)"
    ></app-product-detail-page>

    <app-checkout-page
      *ngIf="currentView === 'checkout'"
      [stage]="checkoutStage"
      [checkoutForm]="checkoutForm"
      [paymentOptions]="paymentOptions"
      [checkoutError]="checkoutError()"
      [orderSubmitting]="orderSubmitting()"
      [isCheckoutDisabled]="isCheckoutDisabled"
      [cart]="checkoutItems"
      [savedItems]="savedItems()"
      [savedAddresses]="savedDeliveryAddressesForCurrentAccount"
      [selectedAddressId]="selectedDeliveryAddressId()"
      [savedPaymentCards]="savedPaymentCardsForCurrentAccount"
      [selectedPaymentCardId]="selectedPaymentCardId()"
      [checkoutItemCount]="checkoutItemCount"
      [cartSubtotal]="checkoutSubtotal"
      [deliveryFee]="checkoutDeliveryFee"
      [cartTotal]="checkoutTotal"
      (submitOrder)="submitOrder()"
      (invalidSubmitOrder)="handleInvalidCheckoutSubmit()"
      (proceedCheckout)="proceedToCheckout()"
      (backHome)="goHomeLanding()"
      (backToCart)="backToCartStage()"
      (openProduct)="openProduct($event)"
      (increaseQuantity)="increaseCartQuantity($event)"
      (decreaseQuantity)="decreaseCartQuantity($event)"
      (deleteItem)="requestRemoveFromCart($event)"
      (saveForLater)="saveItemForLater($event)"
      (moveToCart)="moveSavedItemToCart($event)"
      (deleteSavedItem)="requestRemoveSavedItem($event)"
      (chooseSavedAddress)="chooseCheckoutSavedAddress($event)"
      (confirmSavedAddress)="confirmCheckoutSavedAddress($event)"
      (editSavedAddress)="editCheckoutSavedAddress($event)"
      (deleteSavedAddress)="removeSavedDeliveryAddress($event)"
      (startNewAddress)="startNewCheckoutAddress()"
      (chooseSavedPaymentCard)="chooseCheckoutSavedPaymentCard($event)"
      (confirmSavedPaymentCard)="confirmCheckoutSavedPaymentCard($event)"
      (deleteSavedPaymentCard)="removeSavedPaymentCard($event)"
      (startNewPaymentCard)="startNewCheckoutPaymentCard()"
    ></app-checkout-page>

    <app-confirmation-page
      *ngIf="currentView === 'confirmation'"
      [receipt]="orderReceipt()"
      (continueShopping)="continueShopping()"
      (contactSupport)="setView('support')"
    ></app-confirmation-page>

    <app-sign-in-page
      *ngIf="currentView === 'signin'"
      [form]="signInForm"
      [passwordResetForm]="signInPasswordResetForm"
      [passwordResetMode]="signInPasswordResetMode"
      [noticeMessage]="authNotice"
      [errorMessage]="authError"
      [successMessage]="authSuccess"
      (submitForm)="submitSignIn()"
      (openForgotPassword)="openSignInPasswordReset()"
      (cancelForgotPassword)="closeSignInPasswordReset(true)"
      (submitPasswordResetVerification)="submitSignInPasswordResetVerification()"
      (submitPasswordReset)="submitSignInPasswordReset()"
      (openSignUp)="openSignUp()"
      (openAdmin)="openAdmin()"
      (backHome)="goHomeLanding()"
    ></app-sign-in-page>

    <app-sign-up-page
      *ngIf="currentView === 'signup'"
      [form]="signUpForm"
      [noticeMessage]="authNotice"
      [errorMessage]="authError"
      (submitForm)="submitSignUp()"
      (openSignIn)="openSignIn()"
      (backHome)="goHomeLanding()"
    ></app-sign-up-page>

    <app-admin-page
      *ngIf="currentView === 'admin'"
      [loginForm]="adminLoginForm"
      [productForm]="adminProductForm"
      [products]="products()"
      [sections]="storeSections()"
      [categories]="categories"
      [isAuthenticated]="isAdminAuthenticated()"
      [currentAdmin]="currentAdmin()"
      [adminAccounts]="adminAccounts()"
      [adminUsers]="adminUsers()"
      [overview]="adminOverview()"
      [adminAccountsLoading]="adminAccountsLoading()"
      [adminUsersLoading]="adminUsersLoading()"
      [overviewLoading]="adminOverviewLoading()"
      [detailLoading]="adminDetailLoading()"
      [selectedOrderDetail]="selectedAdminOrderDetail()"
      [selectedProductDetail]="selectedAdminProduct()"
      [editingProductId]="adminEditingProductId"
      [submitting]="adminSubmitting"
      [sectionSubmitting]="adminSectionSubmitting"
      [subAdminSubmitting]="adminSubAdminSubmitting"
      [deletingCustomerUserEmail]="adminDeletingCustomerUserEmail"
      [supportUpdatingTicketId]="adminSupportUpdatingTicketId"
      [errorMessage]="adminError"
      [successMessage]="adminSuccess"
      [maxImageSizeMb]="2"
      (submitLogin)="submitAdminLogin()"
      (submitProduct)="submitAdminProduct()"
      (createSection)="submitAdminSection($event)"
      (createSubAdmin)="submitAdminSubAdmin($event)"
      (deleteSubAdmin)="deleteAdminSubAdmin($event)"
      (deleteCustomerUser)="deleteAdminCustomerUser($event)"
      (updateSection)="updateAdminSection($event)"
      (deleteSection)="deleteAdminSection($event)"
      (deleteProduct)="deleteAdminProduct($event)"
      (signOut)="signOutAdmin()"
      (openCustomerAccess)="openSignIn()"
      (backHome)="goHomeLanding()"
      (imageSelected)="handleAdminImageSelection($event)"
      (refreshInsights)="loadProducts(); loadAdminOverview(); loadAdminAccounts(); loadAdminUsers()"
      (orderSelect)="openAdminOrderDetail($event)"
      (productSelect)="openAdminProductDetail($event)"
      (productEditSelect)="startAdminProductEdit($event)"
      (clearProductEditor)="resetAdminProductEditor()"
      (supportTicketUpdate)="updateAdminSupportTicket($event)"
      (clearDetails)="clearAdminDetails()"
      (reloadCustomerUsers)="loadAdminUsers()"
    ></app-admin-page>
  </main>

  <app-site-footer
    *ngIf="currentView !== 'signin' && currentView !== 'signup' && currentView !== 'admin'"
    [footerColumns]="footerColumns"
    [showBackToTop]="showBackToTop()"
    (backToTop)="scrollToTop()"
  ></app-site-footer>
</div>
