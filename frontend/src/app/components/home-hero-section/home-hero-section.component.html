<div class="hero-grid">
  <article
    class="hero-banner hero-banner-clickable"
    [style.background]="
      'linear-gradient(112deg, rgba(15, 23, 42, 0.42) 0%, rgba(15, 23, 42, 0.22) 28%, rgba(15, 23, 42, 0.08) 58%, rgba(15, 23, 42, 0.02) 100%), url(' +
      activeHero.background +
      ') center/cover no-repeat'
    "
    (click)="heroAction.emit(activeHero.primaryAction)"
  >
    <div class="hero-surface-glow" [style.background]="activeHero.surface"></div>

    <button
      class="hero-side-arrow hero-side-arrow-left"
      type="button"
      (click)="$event.stopPropagation(); previousHero.emit()"
      aria-label="Previous slide"
    >
      <i class="bi bi-chevron-left"></i>
    </button>

    <div class="hero-banner-layout">
      <div class="hero-banner-copy">
        <span class="hero-eyebrow">{{ activeHero.eyebrow }}</span>
        <div class="hero-accent">{{ activeHero.accent }}</div>
        <h1>{{ activeHero.title }}</h1>
        <p>{{ activeHero.subtitle }}</p>

        <div class="hero-actions">
          <button
            class="btn hero-primary"
            type="button"
            (click)="$event.stopPropagation(); heroAction.emit(activeHero.primaryAction)"
          >
            {{ activeHero.cta }}
          </button>
          <button
            class="btn hero-secondary"
            type="button"
            (click)="$event.stopPropagation(); heroAction.emit(activeHero.secondaryAction)"
          >
            {{ activeHero.secondaryCta }}
          </button>
        </div>
      </div>
    </div>

    <button
      class="hero-side-arrow hero-side-arrow-right"
      type="button"
      (click)="$event.stopPropagation(); nextHero.emit()"
      aria-label="Next slide"
    >
      <i class="bi bi-chevron-right"></i>
    </button>

    <div class="hero-pagination" (click)="$event.stopPropagation()">
      <button
        *ngFor="let slide of heroSlides; let index = index"
        type="button"
        class="hero-dot"
        [class.active-hero-dot]="index === activeHeroIndex"
        [attr.aria-label]="'Go to slide ' + (index + 1)"
        (click)="heroSelect.emit(index)"
      ></button>
    </div>
  </article>
</div>
